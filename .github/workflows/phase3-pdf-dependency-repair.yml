name: Phase 3 PDF dependency repair

on:
  push:
    branches: [feat/phase-3-reports]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/phase-3-reports
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm uninstall @cantoo/pdf-lib
      - run: npm install --save-exact pdf-lib@1.17.1
      - name: Commit dependency repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: use stable Node-compatible PDF runtime"
          git push origin HEAD:feat/phase-3-reports
