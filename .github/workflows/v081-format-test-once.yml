name: v0.8.1 format test once

on:
  push:
    branches: [fix/v0.8.1-desktop-transport]
    paths:
      - '.github/workflows/v081-format-test-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/api-client-transport.test.ts
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/api-client-transport.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format desktop transport test"
          git push origin HEAD:${{ github.ref_name }}
