name: Dependency check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve dependency graph without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Known high/critical problems in shipped packages
        run: npm audit --omit=dev --audit-level=high
