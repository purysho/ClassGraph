name: Phase 8 format once

on:
  push:
    branches: [feat/phase-8-native-desktop]
    paths:
      - '.github/workflows/phase8-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: >
          npx prettier --write
          app/index.html
          src/api-dispatch.ts
          src/desktop-renderer-bootstrap.ts
          src/project-store.ts
          src/server.ts
          tests/project-store.test.ts
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html src/api-dispatch.ts src/desktop-renderer-bootstrap.ts src/project-store.ts src/server.ts tests/project-store.test.ts
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git commit -m "style: format Phase 8 native desktop files"
          git push origin HEAD:${{ github.ref_name }}
