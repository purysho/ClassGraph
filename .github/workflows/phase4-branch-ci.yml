name: Phase 4 Branch CI

on:
  push:
    branches: [feat/phase-4-relationships]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show required formatting diff
        run: |
          npx prettier --write docs/PHASE_4.md src/relationship-semantics.ts src/relationships.ts src/workspace.ts tests/relationships.test.ts
          git diff -- docs/PHASE_4.md src/relationship-semantics.ts src/relationships.ts src/workspace.ts tests/relationships.test.ts
          git diff --quiet -- docs/PHASE_4.md src/relationship-semantics.ts src/relationships.ts src/workspace.ts tests/relationships.test.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
