name: Phase 4 Branch CI

on:
  push:
    branches: [feat/phase-4-relationships]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply repository formatting
        run: npx prettier --write .
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "classgraph-ci"
            git config user.email "actions@users.noreply.github.com"
            git add .
            git commit -m "style: apply Phase 4 formatting"
            git push origin HEAD:feat/phase-4-relationships
          fi
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
