name: README screenshots

on:
  push:
    branches: [docs/readme-product-page]
    paths:
      - '.github/workflows/readme-screenshot.yml'
      - 'app/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install temporary screenshot browser
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start ClassGraph
        run: |
          npm start > /tmp/classgraph.log 2>&1 &
          echo $! > /tmp/classgraph.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4317/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/classgraph.log
          exit 1
      - name: Capture real UI screenshots
        run: |
          mkdir -p docs/screenshots
          cat > capture-readme.mjs <<'SCRIPT'
          import { chromium } from 'playwright'
          import { writeFile } from 'node:fs/promises'

          const base = 'http://127.0.0.1:4317'
          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage({
            viewport: { width: 1440, height: 900 },
            deviceScaleFactor: 1.25,
          })

          await page.goto(base, { waitUntil: 'networkidle' })
          await page.screenshot({
            path: 'docs/screenshots/classgraph-start.png',
            fullPage: false,
          })

          const response = await fetch(`${base}/api/synthetic/generate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              projectId: 'readme-demo',
              title: 'Grade 5A English',
              studentCount: 28,
              seed: 'classgraph-readme-demo',
              metricDefinitions: [
                {
                  key: 'score',
                  label: 'Assessment',
                  kind: 'number',
                  numberScale: { min: 0, max: 100 },
                },
                {
                  key: 'participation',
                  label: 'Participation',
                  kind: 'ordinal',
                  ordinalScale: ['1', '2', '3', '4', '5'],
                },
                {
                  key: 'homework',
                  label: 'Homework complete',
                  kind: 'boolean',
                },
              ],
              metrics: [
                {
                  key: 'score',
                  kind: 'number',
                  distribution: {
                    type: 'normal',
                    mean: 73,
                    standardDeviation: 12,
                    min: 0,
                    max: 100,
                  },
                  missingRate: 0.04,
                },
                {
                  key: 'participation',
                  kind: 'ordinal',
                  values: [
                    { value: '1', weight: 1 },
                    { value: '2', weight: 2 },
                    { value: '3', weight: 5 },
                    { value: '4', weight: 4 },
                    { value: '5', weight: 2 },
                  ],
                  missingRate: 0.04,
                },
                {
                  key: 'homework',
                  kind: 'boolean',
                  trueRate: 0.82,
                  missingRate: 0.03,
                },
              ],
            }),
          })
          if (!response.ok) {
            throw new Error(`Synthetic demo request failed: ${response.status}`)
          }
          const payload = await response.json()
          await writeFile('readme-demo.json', JSON.stringify(payload.project))

          await page.setInputFiles('#json-file', 'readme-demo.json')
          await page.locator('#import-form button[type="submit"]').click()
          await page.waitForSelector('.workspace-shell')
          await page.waitForTimeout(350)
          await page.screenshot({
            path: 'docs/screenshots/classgraph-overview.png',
            fullPage: false,
          })

          await page.locator('button[data-view="graphs"]').click()
          await page.waitForTimeout(700)
          await page.screenshot({
            path: 'docs/screenshots/classgraph-graphs.png',
            fullPage: false,
          })

          await browser.close()
          SCRIPT
          node capture-readme.mjs
          rm -f capture-readme.mjs readme-demo.json
      - name: Commit refreshed screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/classgraph-start.png docs/screenshots/classgraph-overview.png docs/screenshots/classgraph-graphs.png
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
            exit 0
          fi
          git commit -m "docs: capture ClassGraph product screenshots"
          git push origin HEAD:${{ github.ref_name }}
