name: Phase 3 format repair

on:
  push:
    branches: [feat/phase-3-reports]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/phase-3-reports
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/PHASE_3.md src/export-json.ts tests/export-json.test.ts
      - name: Commit formatter-only repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PHASE_3.md src/export-json.ts tests/export-json.test.ts
          git commit -m "style: apply Phase 3 Prettier repair"
          git push origin HEAD:feat/phase-3-reports
