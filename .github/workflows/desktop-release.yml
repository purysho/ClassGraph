name: Desktop release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.release/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Verify packaged desktop has no localhost server entry
        run: |
          ! grep -q "createClassGraphServer" src/electron-main.ts
          ! grep -q "\.listen(" src/electron-main.ts
          grep -q "loadFile" src/electron-main.ts
          grep -q "nodeIntegration: false" src/electron-main.ts
          grep -q "contextIsolation: true" src/electron-main.ts

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-latest
            arch: x64
          - id: linux-x64
            runner: ubuntu-latest
            arch: x64
          - id: macos-arm64
            runner: macos-latest
            arch: arm64
          - id: macos-intel
            runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: npm run build:desktop

      - name: Build unpacked Windows app
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: npx electron-builder --dir --win --x64 --publish never

      - name: Smoke-test Windows native app
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\release-desktop\win-unpacked\ClassGraph.exe').Path
          $version = (Get-Item $exe).VersionInfo
          if ($version.ProductName -notlike 'ClassGraph*') {
            throw "Expected ClassGraph product metadata, got '$($version.ProductName)'"
          }
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "ClassGraph Windows desktop self-test failed with exit code $($process.ExitCode)"
          }

      - name: Package Windows installer and portable app
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: npx electron-builder --win --x64 --publish never

      - name: Prepare Windows downloads
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-package | Out-Null
          Copy-Item release-desktop\ClassGraph-Setup.exe release-package\ClassGraph-Setup.exe
          Copy-Item release-desktop\ClassGraph-Portable.exe release-package\ClassGraph-Portable.exe

      - name: Build unpacked Linux app
        if: matrix.id == 'linux-x64'
        run: npx electron-builder --dir --linux --x64 --publish never

      - name: Smoke-test Linux native app
        if: matrix.id == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          bin="$(find release-desktop/linux-unpacked -maxdepth 1 -type f -perm -111 \( -name 'classgraph' -o -name 'ClassGraph' \) | head -n 1)"
          test -n "$bin"
          xvfb-run --auto-servernum "$bin" --no-sandbox --self-test

      - name: Package Linux AppImage
        if: matrix.id == 'linux-x64'
        run: npx electron-builder --linux AppImage --x64 --publish never

      - name: Prepare Linux download
        if: matrix.id == 'linux-x64'
        run: |
          mkdir -p release-package
          cp release-desktop/ClassGraph-Linux-x64.AppImage release-package/ClassGraph-Linux-x64.AppImage
          chmod +x release-package/ClassGraph-Linux-x64.AppImage

      - name: Build unpacked macOS app
        if: startsWith(matrix.id, 'macos-')
        shell: bash
        run: npx electron-builder --dir --mac --${{ matrix.arch }} --publish never

      - name: Smoke-test macOS native app
        if: startsWith(matrix.id, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          bin="$(find release-desktop -path '*/ClassGraph.app/Contents/MacOS/ClassGraph' -type f | head -n 1)"
          test -n "$bin"
          "$bin" --self-test

      - name: Package macOS app
        if: startsWith(matrix.id, 'macos-')
        shell: bash
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Prepare macOS downloads
        if: matrix.id == 'macos-arm64'
        run: |
          mkdir -p release-package
          cp release-desktop/ClassGraph-macOS-arm64.dmg release-package/ClassGraph-macOS-AppleSilicon.dmg
          cp release-desktop/ClassGraph-macOS-arm64.zip release-package/ClassGraph-macOS-AppleSilicon.app.zip

      - name: Prepare macOS Intel downloads
        if: matrix.id == 'macos-intel'
        run: |
          mkdir -p release-package
          cp release-desktop/ClassGraph-macOS-x64.dmg release-package/ClassGraph-macOS-Intel.dmg
          cp release-desktop/ClassGraph-macOS-x64.zip release-package/ClassGraph-macOS-Intel.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: classgraph-${{ matrix.id }}
          path: release-package/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: classgraph-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "ClassGraph ${RELEASE_TAG}" \
            --generate-notes
