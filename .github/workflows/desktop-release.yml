name: Desktop release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.release/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-latest
          - id: linux-x64
            runner: ubuntu-latest
          - id: macos-arm64
            runner: macos-latest
          - id: macos-intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: npm run build:desktop

      - name: Verify Windows branding and self-test
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: |
          $exe = (Resolve-Path '.\release\ClassGraph-Windows-x64.exe').Path
          $version = (Get-Item $exe).VersionInfo
          if ($version.ProductName -ne 'ClassGraph') {
            throw "Expected ClassGraph product metadata, got '$($version.ProductName)'"
          }
          if ($version.FileDescription -notlike 'ClassGraph*') {
            throw "Expected ClassGraph file description, got '$($version.FileDescription)'"
          }
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "ClassGraph Windows self-test failed with exit code $($process.ExitCode)"
          }

      - name: Self-test Linux executable
        if: matrix.id == 'linux-x64'
        run: ./release/ClassGraph-Linux-x64 --self-test

      - name: Self-test macOS arm64 executable
        if: matrix.id == 'macos-arm64'
        run: ./release/ClassGraph-macOS-arm64 --self-test

      - name: Self-test macOS Intel executable
        if: matrix.id == 'macos-intel'
        run: ./release/ClassGraph-macOS-x64 --self-test

      - name: Prepare Windows download
        if: matrix.id == 'windows-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-package | Out-Null
          Copy-Item release\ClassGraph-Windows-x64.exe release-package\ClassGraph-Windows-x64.exe

      - name: Prepare Linux download
        if: matrix.id == 'linux-x64'
        run: |
          mkdir -p release-package/ClassGraph
          cp release/ClassGraph-Linux-x64 release-package/ClassGraph/ClassGraph-Linux-x64
          cp .desktop-build/classgraph-icon.png release-package/ClassGraph/ClassGraph.png
          cat > release-package/ClassGraph/ClassGraph.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=ClassGraph
          Comment=Local-first classroom analysis and planning
          Exec=ClassGraph-Linux-x64
          Icon=ClassGraph
          Terminal=false
          Categories=Education;
          DESKTOP
          chmod +x release-package/ClassGraph/ClassGraph-Linux-x64
          chmod +x release-package/ClassGraph/ClassGraph.desktop
          tar -czf release-package/ClassGraph-Linux-x64.tar.gz -C release-package ClassGraph
          rm -rf release-package/ClassGraph

      - name: Prepare macOS app
        if: startsWith(matrix.id, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${{ matrix.id }}" == "macos-arm64" ]]; then
            SOURCE="release/ClassGraph-macOS-arm64"
            ARCHIVE="ClassGraph-macOS-AppleSilicon.app.zip"
          else
            SOURCE="release/ClassGraph-macOS-x64"
            ARCHIVE="ClassGraph-macOS-Intel.app.zip"
          fi

          APP="release-package/ClassGraph.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$SOURCE" "$APP/Contents/MacOS/ClassGraph"

          ICONSET=".desktop-build/ClassGraph.iconset"
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          sips -z 16 16 .desktop-build/classgraph-icon.png --out "$ICONSET/icon_16x16.png" >/dev/null
          sips -z 32 32 .desktop-build/classgraph-icon.png --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 .desktop-build/classgraph-icon.png --out "$ICONSET/icon_32x32.png" >/dev/null
          sips -z 64 64 .desktop-build/classgraph-icon.png --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 .desktop-build/classgraph-icon.png --out "$ICONSET/icon_128x128.png" >/dev/null
          sips -z 256 256 .desktop-build/classgraph-icon.png --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 .desktop-build/classgraph-icon.png --out "$ICONSET/icon_256x256.png" >/dev/null
          sips -z 512 512 .desktop-build/classgraph-icon.png --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 .desktop-build/classgraph-icon.png --out "$ICONSET/icon_512x512.png" >/dev/null
          sips -z 1024 1024 .desktop-build/classgraph-icon.png --out "$ICONSET/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/ClassGraph.icns"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>ClassGraph</string>
            <key>CFBundleIdentifier</key><string>com.purysho.classgraph</string>
            <key>CFBundleName</key><string>ClassGraph</string>
            <key>CFBundleDisplayName</key><string>ClassGraph</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>ClassGraph.icns</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
          </dict></plist>
          PLIST

          chmod +x "$APP/Contents/MacOS/ClassGraph"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "release-package/$ARCHIVE"
          rm -rf "$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: classgraph-${{ matrix.id }}
          path: release-package/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: classgraph-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "ClassGraph ${RELEASE_TAG}" \
            --generate-notes
