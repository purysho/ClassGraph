name: Phase 3 export dependencies

on:
  push:
    branches: [feat/phase-3-reports]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/phase-3-reports
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --save-exact docx@9.7.1 @cantoo/pdf-lib@2.11.0
      - name: Commit dependency lock
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: add Phase 3 export dependencies"
          git push origin HEAD:feat/phase-3-reports
