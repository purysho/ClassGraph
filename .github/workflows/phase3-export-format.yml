name: Phase 3 export surface format

on:
  push:
    branches: [feat/phase-3-reports]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/phase-3-reports
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write app/styles.css src/app-client.ts src/eduboard-handback.ts src/server.ts tests/server.test.ts
      - name: Commit formatter-only repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/styles.css src/app-client.ts src/eduboard-handback.ts src/server.ts tests/server.test.ts
          git commit -m "style: format Phase 3 export surface"
          git push origin HEAD:feat/phase-3-reports
