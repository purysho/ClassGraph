name: Phase 2 final format repair

on:
  push:
    branches: [feat/phase-2-seating]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/phase-2-seating
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply pinned Prettier
        run: |
          npx prettier --write \
            app/styles.css \
            src/app-client.ts \
            src/grouping.ts \
            src/planning.ts \
            src/project-mutations.ts \
            src/room.ts \
            src/schema.ts \
            src/server.ts \
            tests/grouping.test.ts \
            tests/planning-state.test.ts \
            tests/planning.test.ts \
            tests/project-mutations.test.ts \
            tests/room.test.ts \
            tests/server.test.ts
      - name: Commit formatter-only repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/styles.css src tests
          git commit -m "style: apply Phase 2 final Prettier repair"
          git push origin HEAD:feat/phase-2-seating
