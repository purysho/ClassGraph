name: Phase 8 bootstrap assets

on:
  push:
    branches: [feat/phase-8-native-desktop]
    paths:
      - '.github/workflows/phase8-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.3
          cache: npm
      - name: Refresh npm lockfile
        run: npm install --ignore-scripts
      - name: Generate ClassGraph native icons from repository SVG
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          python -m pip install --disable-pip-version-check pillow
          mkdir -p build
          rsvg-convert -w 1024 -h 1024 docs/branding/classgraph-mark.svg -o build/icon.png
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          path = Path('build/icon.png')
          image = Image.open(path).convert('RGBA')
          image.save(
              'build/icon.ico',
              format='ICO',
              sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)],
          )
          image.save('build/icon.icns', format='ICNS')
          PY
      - name: Commit lockfile and native icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json build/icon.png build/icon.ico build/icon.icns
          if git diff --cached --quiet; then
            echo "Bootstrap assets unchanged"
            exit 0
          fi
          git commit -m "build: add Electron lockfile and native ClassGraph icons"
          git push origin HEAD:${{ github.ref_name }}
